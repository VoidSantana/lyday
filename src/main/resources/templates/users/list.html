<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Usuários - Lyday</title>
    <script defer src="/js/app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 24px; max-width: 720px; margin: 0 auto; }
        input { padding: 8px; margin: 4px 0; width: 100%; }
        button { padding: 10px 12px; margin-top: 8px; }
        .error { color: #ff6b6b; margin-top: 12px; }
    </style>
</head>
<body>
<h2>Usuários (ADMIN)</h2>

<button onclick="window.location.href='/products'">Voltar para Produtos</button>
<button onclick="logout()">Sair</button>

<h3>Criar usuário</h3>

<label>Username</label>
<input id="username" placeholder="ex: usercomum" />

<label>Password</label>
<input id="password" type="password" placeholder="ex: 123456" />

<label>Roles (ex: ROLE_USER ou ROLE_ADMIN)</label>
<input id="roles" placeholder="ROLE_USER" />

<button id="btnCreateUser">Criar</button>

<div id="msg" class="error"></div>

<script>
    function logout() {
        clearToken();
        window.location.href = "/login";
    }

    async function createUser() {
        const msg = document.getElementById("msg");
        msg.textContent = "";

        const payload = {
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
            roles: document.getElementById("roles").value.split(",").map(r => r.trim()).filter(Boolean)
        };

        const res = await apiFetch("/api/users", {
            method: "POST",
            body: JSON.stringify(payload)
        });

        if (!res.ok) {
            let err = "Erro ao criar usuário (você precisa ser ADMIN)";
            try {
                const data = await res.json();
                err = data.message || err;
            } catch(e) {}
            msg.textContent = err;
            return;
        }

        msg.textContent = "Usuário criado com sucesso!";
    }

    requireAuthOrRedirect();
    document.getElementById("btnCreateUser").addEventListener("click", createUser);
</script>
</body>
</html>
